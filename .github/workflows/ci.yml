name: Pipeline CI/CD - Classificador de Spam

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  testes:
    name: 1 - Build e testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar codigo Python
        run: python -m compileall -q app

      - name: Testar construcao da aplicacao
        run: docker build -t classificador-spam .

      - name: Iniciar API para teste
        run: |
          docker run -d \
            --name spam-api-ci \
            -p 8000:8000 \
            -e API_KEY=chave-teste-ci \
            -e APP_ENV=ci \
            -e MODEL_VERSION=v1 \
            classificador-spam

      - name: Testar API
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8000/health; then
              break
            fi
            sleep 3
          done

          curl -fsS http://localhost:8000/health

          curl -fsS -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -H "X-API-Key: chave-teste-ci" \
            -d '{"texto":"PARABENS! Voce ganhou um premio. Clique agora!"}' \
            -o resposta.json

          python -c "import json; r=json.load(open('resposta.json')); assert r['rotulo']=='spam', r; print('Teste aprovado!')"

      - name: Limpar container
        if: always()
        run: docker rm -f spam-api-ci || true

  empacotamento:
    name: 2 - Empacotamento
    needs: testes
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Construir imagem Docker
        run: docker build -t classificador-spam .

  deploy:
    name: 3 - Deploy no Render
    needs: empacotamento
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    
    steps:
      - name: Acionar deploy no Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Erro: Deploy Hook nao configurado."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

          echo "Solicitacao de deploy enviada ao Render!"